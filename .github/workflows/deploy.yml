name: WaterWerk Architect - build, test en deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test en bouw
    runs-on: ubuntu-latest
    steps:
      - name: Checkout broncode
        uses: actions/checkout@v4
      - name: Node.js installeren
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies installeren
        run: npm install --no-audit --no-fund
      - name: TypeScript controleren
        run: npx tsc --noEmit
      - name: Unit-tests uitvoeren
        run: npm test
      - name: Productiebuild uitvoeren
        run: npm run build
      - name: GitHub Pages configureren
        uses: actions/configure-pages@v5
      - name: Build-artifact uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Publiceren naar GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
